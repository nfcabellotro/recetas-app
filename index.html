<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali.AI | Comer inteligente, disfrutar sin culpa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #00C896;
            --color-secondary: #A8E063;
            --color-text: #2E2E2E;
            --color-text-secondary: #6B6B6B;
            --color-bg: #FFFFFF;
            --color-bg-alt: #ECFFF7;
            --color-success: #28A745;
            --color-warning: #FFB347;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(130deg, var(--color-bg-alt) 0%, #F6FFF9 45%, #FFFFFF 100%);
            color: var(--color-text);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: var(--color-bg);
            padding: 26px 28px;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-logo {
            width: 72px;
            height: 72px;
        }

        .brand-text h1 {
            color: #000000;
            margin-bottom: 6px;
            font-size: 34px;
            letter-spacing: -0.5px;
        }

        .brand-text .subtitle {
            color: var(--color-text-secondary);
            font-size: 16px;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 200, 150, 0.08);
            border-radius: 999px;
            padding: 10px 18px;
            border: 1px solid rgba(0, 200, 150, 0.18);
        }

        .header-user span {
            font-weight: 600;
            color: var(--color-text);
        }

        .header-actions {
            margin-top: 22px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: var(--color-bg);
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
            height: fit-content;
        }

        .content-area {
            background: var(--color-bg);
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--color-text);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--color-secondary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--color-text);
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #E2E8E5;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: var(--color-bg);
            color: var(--color-text);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(0, 200, 150, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
            box-shadow: 0 12px 24px rgba(0, 200, 150, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: var(--color-secondary);
            box-shadow: 0 14px 28px rgba(168, 224, 99, 0.3);
        }

        .btn-secondary {
            background: var(--color-bg-alt);
            color: var(--color-text);
            border: 1px solid rgba(0, 200, 150, 0.1);
        }

        .btn-secondary:hover {
            background: #eef4f2;
            border-color: rgba(0, 200, 150, 0.3);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
            width: auto;
        }

        .tags-input {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .type-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .type-option {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 16px;
            border: 1px solid rgba(0, 200, 150, 0.3);
            background: rgba(0, 200, 150, 0.08);
            color: var(--color-text);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .type-option input {
            accent-color: var(--color-primary);
        }

        .type-option:hover {
            background: rgba(168, 224, 99, 0.2);
            border-color: rgba(168, 224, 99, 0.4);
        }

        .tag {
            background: rgba(0, 200, 150, 0.12);
            color: var(--color-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(0, 200, 150, 0.2);
        }

        .tag-remove {
            cursor: pointer;
            font-weight: bold;
        }

        .ingredient-item, .step-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .ingredient-item input, .step-item input {
            flex: 1;
        }

        .ingredient-item select {
            flex: 0 0 100px;
        }

        .ingredient-quantity-container {
            display: flex;
            gap: 5px;
            flex: 1;
        }

        .ingredient-quantity-container input {
            flex: 1;
        }

        .ingredient-quantity-container select {
            flex: 0 0 90px;
        }

        .edit-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-edit {
            background: #28a745;
            color: white;
        }

        .btn-edit:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .recipe-card-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }

        .recipe-card-actions button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .filters {
            margin-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .recipe-card {
            background: var(--color-bg);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.06);
        }

        .recipe-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border-color: rgba(0, 200, 150, 0.4);
        }

        .recipe-card.selected {
            border-color: rgba(0, 200, 150, 0.6);
            background: rgba(168, 224, 99, 0.08);
        }

        .recipe-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 12px;
        }

        .recipe-types {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .recipe-type {
            display: inline-flex;
            align-items: center;
            background: var(--color-primary);
            color: white;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
        }

        .recipe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .recipe-tag {
            background: var(--color-bg-alt);
            color: var(--color-text-secondary);
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 11px;
            border: 1px solid rgba(0, 200, 150, 0.18);
        }

        .recipe-ingredients-count {
            color: var(--color-text-secondary);
            font-size: 12px;
            margin-top: 5px;
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .recipe-image-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }

        .recipe-info {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--color-text-secondary);
        }

        .recipe-info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .recipe-detail-image-wrapper {
            width: 100%;
            max-width: 640px;
            margin: 0 auto 24px auto;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 18px 32px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .recipe-detail-image {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .recipe-detail-image-placeholder {
            width: 100%;
            padding: 120px 0;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 72px;
        }

        .recipe-detail-info {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            padding: 18px;
            background: var(--color-bg-alt);
            border-radius: 14px;
            border: 1px solid rgba(0, 200, 150, 0.12);
        }

        .recipe-detail-info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .recipe-detail-info-label {
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-bottom: 4px;
        }

        .recipe-detail-info-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-primary);
        }

        .image-preview {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }

        .image-upload-container {
            margin-top: 10px;
        }

        .recipe-detail {
            display: none;
            margin-top: 30px;
        }

        .recipe-detail.active {
            display: block;
        }

        .recipe-detail-header {
            margin-bottom: 20px;
        }

        .detail-actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            justify-items: center;
            margin-bottom: 20px;
        }

        .detail-actions .btn {
            width: 100%;
            margin-bottom: 0;
            text-align: center;
        }

        .recipe-detail-title {
            font-size: 30px;
            color: var(--color-text);
            margin-bottom: 12px;
        }

        .ingredients-list {
            background: var(--color-bg);
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.06);
        }

        .ingredients-list h3 {
            margin-bottom: 15px;
            color: var(--color-text);
        }

        .ingredient-list-item {
            padding: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            color: var(--color-text-secondary);
        }

        .ingredient-list-item:last-child {
            border-bottom: none;
        }

        .steps-list {
            background: var(--color-bg);
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.06);
        }

        .steps-list h3 {
            margin-bottom: 15px;
            color: var(--color-text);
        }

        .step-list-item {
            padding: 16px;
            margin-bottom: 15px;
            background: var(--color-bg-alt);
            border-radius: 12px;
            border-left: 4px solid var(--color-primary);
            color: var(--color-text);
        }

        .step-number {
            font-weight: 700;
            color: var(--color-primary);
            margin-right: 10px;
        }

        .file-upload {
            border: 2px dashed rgba(0, 200, 150, 0.5);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
            background: rgba(0, 200, 150, 0.05);
            color: var(--color-text-secondary);
        }

        .file-upload:hover {
            background: rgba(168, 224, 99, 0.18);
        }

        .file-upload input {
            display: none;
        }

        .hidden {
            display: none;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--color-text-secondary);
        }

        .app-footer {
            margin-top: 40px;
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20000;
            backdrop-filter: blur(2px);
        }

        .loading-content {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--color-bg);
            padding: 16px 24px;
            border-radius: 18px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.12);
            font-size: 18px;
            color: var(--color-text);
            font-weight: 600;
        }

        .loading-icon {
            font-size: 28px;
            animation: loading-bounce 0.9s ease-in-out infinite;
        }

        @keyframes loading-bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .loading-overlay.hidden {
            display: none;
        }

        /* Login Modal */
        .login-modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .login-modal.hidden {
            display: none;
        }

        .login-box {
            background: var(--color-bg);
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.18);
            max-width: 400px;
            width: 90%;
        }

        .login-box h2 {
            color: var(--color-primary);
            margin-bottom: 20px;
            text-align: center;
            font-size: 26px;
        }

        .login-error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        /* Recipe Modal */
        .recipe-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            overflow-y: auto;
            padding: 20px;
        }

        .recipe-modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .recipe-modal-content {
            background: var(--color-bg);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            max-height: 90vh;
            overflow-y: auto;
        }

        .recipe-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 200, 150, 0.3);
        }

        .recipe-modal-header h2 {
            color: var(--color-primary);
            margin: 0;
        }

        .close-modal {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .close-modal:hover {
            background: #c82333;
        }

        /* Filters Bar */
        .filters-bar {
            background: var(--color-bg);
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .filters-bar .filter-group {
            margin-bottom: 0;
        }

        .filters-bar .btn {
            margin-bottom: 0;
        }

        /* Floating Add Button */
        .floating-add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--color-primary);
            color: white;
            border: none;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 18px 30px rgba(0, 200, 150, 0.35);
            transition: all 0.3s;
            z-index: 1000;
        }

        .floating-add-btn:hover {
            transform: scale(1.08);
            background: var(--color-secondary);
            box-shadow: 0 20px 36px rgba(168, 224, 99, 0.4);
        }

        .logout-btn {
            background: var(--color-primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 24px rgba(0, 200, 150, 0.25);
        }

        .logout-btn:hover {
            background: var(--color-secondary);
            box-shadow: 0 12px 28px rgba(168, 224, 99, 0.28);
        }

        /* Content area without sidebar */
        .content-area-full {
            background: var(--color-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.08);
        }

        .main-content-full {
            display: block;
        }

        @media (max-width: 768px) {
            .filters-bar {
                grid-template-columns: 1fr;
            }
            
            .floating-add-btn {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-content">
            <div class="loading-icon">🍽️</div>
            <div id="loadingMessage">Cargando...</div>
        </div>
    </div>
    <!-- Login Modal -->
    <div id="loginModal" class="login-modal">
        <div class="login-box">
            <h2>🔐 Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Usuario</label>
                    <input type="text" id="loginUsername" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <div id="loginError" class="login-error hidden"></div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <!-- App Content (hidden until login) -->
    <div id="appContent" class="hidden">
        <div class="container">
            <header>
                <div class="header-top">
                    <div class="brand">
                        <img src="assets/kali-logo.svg" alt="Logo Kali.AI" class="brand-logo">
                        <div class="brand-text">
                            <h1>Kali.AI</h1>
                            <p class="subtitle">Comer inteligente, disfrutar sin culpa</p>
                    </div>
                    </div>
                    <div class="header-user">
                        <span id="currentUserDisplay">Usuario</span>
                    <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
                    </div>
                </div>
            </header>

            <!-- Filters Bar -->
            <div class="filters-bar">
                <div class="filter-group">
                    <label for="filterType">Tipo de Comida</label>
                    <select id="filterType">
                        <option value="">Todos</option>
                        <option value="Desayuno">Desayuno</option>
                        <option value="Almuerzo">Almuerzo</option>
                        <option value="Cena">Cena</option>
                        <option value="Postre">Postre</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Aperitivo">Aperitivo</option>
                        <option value="Snack">Snack</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterTags">Tags</label>
                    <input type="text" id="filterTags" placeholder="ej: vegano, rápido">
                </div>

                <div class="filter-group">
                    <label for="filterIngredient">Ingrediente</label>
                    <input type="text" id="filterIngredient" placeholder="Buscar por ingrediente">
                </div>

                <div class="filter-group">
                    <button type="button" class="btn btn-primary" onclick="applyFilters()">Aplicar Filtros</button>
                </div>

                <div class="filter-group">
                    <button type="button" class="btn btn-secondary" onclick="clearFilters()">Limpiar</button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area-full">
                <div id="recipesGrid" class="recipes-grid">
                    <!-- Las recetas se mostrarán aquí -->
                </div>

                <div id="recipeDetail" class="recipe-detail">
                    <div class="recipe-detail-header">
                        <div class="detail-actions">
                            <button type="button" class="btn btn-primary" onclick="closeDetail()">Cerrar</button>

    <script>
        // ============================================
        // CONFIGURACIÓN DE FIREBASE
        // ============================================
        // Para usar Firebase:
        // 1. Crea un proyecto en https://console.firebase.google.com/
        // 2. Habilita Firestore Database
        // 3. Obtén tus credenciales de la configuración del proyecto
        // 4. Reemplaza los valores abajo con tus credenciales
        // 5. Cambia USE_FIREBASE a true
        // ============================================
        
        const USE_FIREBASE = true; // Firebase habilitado
        const ENABLE_SAMPLE_DATA = !USE_FIREBASE; // Solo sembrar datos en modo local
        
        const firebaseConfig = {
            apiKey: "AIzaSyDnPPTwPYFCLAeQK9X8lbAHGbkJWOBTzkE",
            authDomain: "recetas-app-2994d.firebaseapp.com",
            projectId: "recetas-app-2994d",
            storageBucket: "recetas-app-2994d.firebasestorage.app",
            messagingSenderId: "85982081327",
            appId: "1:85982081327:web:881285e4cd9bb12f02f1da"
        };

        // Inicializar Firebase si está habilitado
        let db = null;
        if (USE_FIREBASE) {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                console.log('🔥 Firebase inicializado correctamente');
            } catch (error) {
                console.error('❌ Error al inicializar Firebase:', error);
                console.log('⚠️ Usando localStorage como respaldo');
            }
        }

        // ============================================
        // ALMACENAMIENTO DE RECETAS
        // ============================================
        // Opción 1: Firebase Firestore (en la nube)
        // - Los datos se guardan en la nube
        // - Sincronización entre dispositivos
        // - No se pierden al limpiar caché
        // - Requiere configuración inicial
        //
        // Opción 2: localStorage (local)
        // - Los datos se guardan en el navegador
        // - Solo funciona en ese navegador
        // - Se pierden al limpiar caché
        // - No requiere configuración
        // ============================================
        
        let recipes = [];
        let currentFilters = {
            type: '',
            tags: '',
            ingredient: ''
        };
        let editingRecipeId = null;
        let currentUserName = '';
        let loadingCount = 0;

        function showLoading(message) {
            const overlay = document.getElementById('loadingOverlay');
            const messageElement = document.getElementById('loadingMessage');
            if (!overlay || !messageElement) return;
            loadingCount++;
            messageElement.textContent = message || 'Cargando...';
            overlay.classList.remove('hidden');
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            const messageElement = document.getElementById('loadingMessage');
            if (!overlay || !messageElement) return;
            loadingCount = Math.max(loadingCount - 1, 0);
            if (loadingCount === 0) {
                overlay.classList.add('hidden');
                messageElement.textContent = 'Cargando...';
            }
        }

        const RECIPE_TYPE_OPTIONS = [
            "Desayuno",
            "Almuerzo",
            "Cena",
            "Postre",
            "Bebida",
            "Aperitivo",
            "Snack"
        ];

        function normalizeRecipe(recipe) {
            const types = Array.isArray(recipe.types)
                ? recipe.types
                : (recipe.type ? [recipe.type] : []);

            return {
                ...recipe,
                types,
                type: types[0] || '',
                tags: Array.isArray(recipe.tags) ? recipe.tags : [],
                ingredients: Array.isArray(recipe.ingredients) ? recipe.ingredients : [],
                steps: Array.isArray(recipe.steps) ? recipe.steps : []
            };
        }

        function getRecipeTypes(recipe) {
            if (!recipe) return [];
            return Array.isArray(recipe.types)
                ? recipe.types
                : (recipe.type ? [recipe.type] : []);
        }

        // Datos de ejemplo
        const sampleRecetas = [
            {
                id: 1,
                name: "Pasta Carbonara",
                type: "Cena",
                types: ["Cena"],

                    { name: "Aderezo César", quantity: "100 ml", unit: "ml" }
                ],
                steps: [

                ]
            }
        ];

        // ============================================
        // FUNCIONES DE ALMACENAMIENTO
        // ============================================
        
        async function loadRecipes() {
            showLoading('Cargando recetas...');
            try {
            if (USE_FIREBASE && db) {
                try {
                    const snapshot = await db.collection('recipes').get();
                    recipes = snapshot.docs.map(doc => {
                        const data = doc.data();
                        // Asegurar que el ID sea un número si es posible, sino mantener el string
                        const id = isNaN(doc.id) ? doc.id : parseInt(doc.id);
                            return normalizeRecipe({ ...data, id: id });
                    });
                    console.log('✅ Recetas cargadas desde Firebase:', recipes.length);
                } catch (error) {
                    console.error('❌ Error al cargar recetas desde Firebase:', error);
                    // Intentar cargar desde localStorage como respaldo
                        recipes = (JSON.parse(localStorage.getItem('recipes')) || []).map(normalizeRecipe);
                }
            } else {
                // Usar localStorage
                    recipes = (JSON.parse(localStorage.getItem('recipes')) || []).map(normalizeRecipe);
            }
            
            // Cargar recetas de ejemplo si no hay ninguna
            if (recipes.length === 0 && ENABLE_SAMPLE_DATA) {
                recipes = sampleRecetas.map(normalizeRecipe);
                if (!USE_FIREBASE || !db) {
                    await saveRecipes();
                } else {
                    console.warn('⚠️ Datos de ejemplo disponibles pero no se insertan porque Firebase está habilitado.');
                }
            }
            
            renderRecipes();
            } finally {
                hideLoading();
            }
        }

        async function saveRecipes() {
            if (USE_FIREBASE && db) {
                try {
                    // Sincronizar todas las recetas con Firebase
                    // Esto solo se usa cuando se cargan recetas de ejemplo por primera vez
                    const batch = db.batch();
                    recipes.forEach(recipe => {
                        const { id, ...recipeData } = recipe;
                        const docRef = db.collection('recipes').doc(id.toString());
                        batch.set(docRef, recipeData);
                    });
                    await batch.commit();
                    console.log('✅ Recetas guardadas en Firebase');
                } catch (error) {
                    console.error('❌ Error al guardar en Firebase:', error);
                    // Guardar en localStorage como respaldo
                    localStorage.setItem('recipes', JSON.stringify(recipes));
                }
            } else {
                // Usar localStorage
                localStorage.setItem('recipes', JSON.stringify(recipes));
            }
        }

        async function addRecipe(recipe) {
            const normalizedRecipe = normalizeRecipe(recipe);
            recipes.push(normalizedRecipe);
            if (USE_FIREBASE && db) {
                try {
                    const { id, ...recipeData } = normalizedRecipe;
                    await db.collection('recipes').doc(id.toString()).set(recipeData);
                    console.log('✅ Receta agregada a Firebase');
                    // También guardar en localStorage como respaldo
                    localStorage.setItem('recipes', JSON.stringify(recipes));
                } catch (error) {
                    console.error('❌ Error al agregar receta a Firebase:', error);
                    // Guardar en localStorage como respaldo
                    localStorage.setItem('recipes', JSON.stringify(recipes));
                }
            } else {
                // Usar solo localStorage
                localStorage.setItem('recipes', JSON.stringify(recipes));
            }
        }

        async function updateRecipe(recipeId, updatedRecipe) {
            const index = recipes.findIndex(r => r.id === recipeId);
            if (index !== -1) {
                const normalizedRecipe = normalizeRecipe(updatedRecipe);
                recipes[index] = normalizedRecipe;
                
                if (USE_FIREBASE && db) {
                    try {
                        const { id, ...recipeData } = normalizedRecipe;
                        await db.collection('recipes').doc(id.toString()).set(recipeData);
                        console.log('✅ Receta actualizada en Firebase');
                        // También guardar en localStorage como respaldo
                        localStorage.setItem('recipes', JSON.stringify(recipes));
                    } catch (error) {
                        console.error('❌ Error al actualizar receta en Firebase:', error);
                        // Guardar en localStorage como respaldo
                        localStorage.setItem('recipes', JSON.stringify(recipes));
                    }
                } else {
                    // Usar solo localStorage
                    localStorage.setItem('recipes', JSON.stringify(recipes));
                }
            }
        }

        async function deleteRecipeFromStorage(recipeId) {
            const index = recipes.findIndex(r => r.id === recipeId);
            if (index !== -1) {
                recipes.splice(index, 1);
                
                if (USE_FIREBASE && db) {
                    try {
                        await db.collection('recipes').doc(recipeId.toString()).delete();
                        console.log('✅ Receta eliminada de Firebase');
                        // También guardar en localStorage como respaldo
                        localStorage.setItem('recipes', JSON.stringify(recipes));
                    } catch (error) {
                        console.error('❌ Error al eliminar receta de Firebase:', error);
                        // Guardar en localStorage como respaldo
                        localStorage.setItem('recipes', JSON.stringify(recipes));
                    }
                } else {
                    // Usar solo localStorage
                    localStorage.setItem('recipes', JSON.stringify(recipes));
                }
            }
        }

        // ============================================
        // LOGIN FUNCTIONS
        // ============================================
        const ADMIN_PASS = 'admin';

        function updateHeaderUser() {
            const display = document.getElementById('currentUserDisplay');
            if (display) {
                display.textContent = currentUserName ? currentUserName : 'Usuario';
            }
        }

        async function checkLogin() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (isLoggedIn) {
                currentUserName = localStorage.getItem('loggedInUser') || '';
                await showApp();
            } else {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('appContent').classList.add('hidden');
        }

        async function showApp() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            if (!currentUserName) {
                currentUserName = localStorage.getItem('loggedInUser') || '';
            }
            updateHeaderUser();
            await loadRecipes();
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('loggedInUser');
            currentUserName = '';
            showLogin();
            updateHeaderUser();
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            const trimmedUsername = username.trim();
            if (!trimmedUsername) {
                errorDiv.textContent = 'Ingresa un nombre de usuario';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (password === ADMIN_PASS) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('loggedInUser', trimmedUsername);
                currentUserName = trimmedUsername;
                errorDiv.classList.add('hidden');
                showApp();
                updateHeaderUser();
            } else {
                errorDiv.textContent = 'Contraseña incorrecta';
                errorDiv.classList.remove('hidden');
            }
        });

        // ============================================
        // MODAL FUNCTIONS
        // ============================================
        function openRecipeModal() {
            resetForm();
            document.getElementById('modalTitle').textContent = 'Agregar Receta';
            document.getElementById('recipeModal').classList.add('active');
        }

            document.getElementById('recipeModal').classList.remove('active');
            resetForm();
        }

        document.getElementById('recipeModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeRecipeModal();
            }
        });

        document.addEventListener('DOMContentLoaded', async function() {
            checkLogin();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('recipeForm').addEventListener('submit', handleFormSubmit);
            document.getElementById('recipeTags').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();

        let currentImageData = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageData = e.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const name = document.getElementById('recipeName').value;
            const types = Array.from(document.querySelectorAll('.type-checkbox'))
                .filter(checkbox => checkbox.checked)
                .map(checkbox => checkbox.value);
            const tags = Array.from(document.querySelectorAll('#tagsContainer .tag')).map(tag => tag.textContent.replace('×', '').trim());
            const calories = document.getElementById('recipeCalories').value ? parseInt(document.getElementById('recipeCalories').value) : null;
            const servings = document.getElementById('recipeServings').value ? parseInt(document.getElementById('recipeServings').value) : null;
            const imageUrl = document.getElementById('recipeImageUrl').value.trim();
            const image = currentImageData || imageUrl || null;
            
            const ingredients = Array.from(document.querySelectorAll('.ingredient-item')).map(item => {
                const name = item.querySelector('.ingredient-name').value;
                const quantity = item.querySelector('.ingredient-quantity').value;
                const unit = item.querySelector('.ingredient-unit').value;
                if (!name || !quantity) return null;
                return { 
                    name, 
                    quantity: quantity + (unit ? ' ' + unit : ''),
                    unit: unit
                };
            }).filter(ing => ing !== null);
            
            const steps = Array.from(document.querySelectorAll('.step-item')).map(item => {
                return item.querySelector('.step-text').value;
            }).filter(step => step);

            if (ingredients.length === 0 || steps.length === 0) {
                alert('Por favor, agrega al menos un ingrediente y un paso');
                return;
            }

            if (types.length === 0) {
                alert('Selecciona al menos un tipo de comida');
                return;
            }

            const isEditing = Boolean(editingRecipeId);
            const recipeId = editingRecipeId || Date.now();
            const recipe = {
                id: recipeId,
                name,
                type: types[0] || '',
                types,
                tags,
                ingredients,
                steps,
                calories,
                servings,
                image
            };

            const detailWasOpen = document.getElementById('recipeDetail').classList.contains('active');
            const editingIdBeforeReset = editingRecipeId;
            let successMessage = '';

            showLoading(isEditing ? 'Actualizando receta...' : 'Guardando receta...');
            try {
                if (isEditing) {
                await updateRecipe(editingRecipeId, recipe);
                    successMessage = 'Receta actualizada exitosamente!';
            } else {
                await addRecipe(recipe);
                    successMessage = 'Receta guardada exitosamente!';
            }

            renderRecipes();
            closeRecipeModal();
            
                if (isEditing && detailWasOpen) {
                    showRecipeDetail(editingIdBeforeReset);
                }
            } catch (error) {
                console.error('❌ Error al guardar la receta:', error);
                alert('Ocurrió un error al guardar la receta. Intenta nuevamente.');
            } finally {
                hideLoading();
            }

            if (successMessage) {
                alert(successMessage);
            }
        }

            currentImageData = null;
            editingRecipeId = null;
            document.getElementById('ingredientsContainer').innerHTML = `

                    <input type="text" placeholder="Ingrediente" class="ingredient-name">
                    <div class="ingredient-quantity-container">
                        <input type="number" placeholder="Cantidad" class="ingredient-quantity" step="0.01" min="0">
                        <select class="ingredient-unit">
                            <option value="g">g (gramos)</option>
                            <option value="kg">kg (kilogramos)</option>
                            <option value="ml">ml (mililitros)</option>
                            <option value="l">l (litros)</option>
                            <option value="oz">oz (onzas)</option>
                            <option value="lb">lb (libras)</option>
                            <option value="taza">taza</option>
                            <option value="cda">cda (cucharada)</option>
                            <option value="cdita">cdita (cucharadita)</option>
                            <option value="unidad">unidad</option>
                            <option value="pieza">pieza</option>
                            <option value="diente">diente</option>
                            <option value="hoja">hoja</option>
                            <option value="ramo">ramo</option>
                            <option value="pizca">pizca</option>
                            <option value="al gusto">al gusto</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-small btn-secondary" onclick="removeIngredient(this)">-</button>
                </div>
            `;
            document.getElementById('stepsContainer').innerHTML = '<div class="step-item"><input type="text" placeholder="Paso a paso" class="step-text"><button type="button" class="btn btn-small btn-secondary" onclick="removeStep(this)">-</button></div>';
        }


        function addTag() {
            const input = document.getElementById('recipeTags');
            const tag = input.value.trim();
            if (tag) {
                const tagElement = document.createElement('div');
                tagElement.className = 'tag';
                tagElement.innerHTML = `${tag} <span class="tag-remove" onclick="this.parentElement.remove()">×</span>`;
                document.getElementById('tagsContainer').appendChild(tagElement);
                input.value = '';
            }
        }

        function addIngredient() {
            const container = document.getElementById('ingredientsContainer');
            const div = document.createElement('div');
            div.className = 'ingredient-item';
            div.innerHTML = `
                <input type="text" placeholder="Ingrediente" class="ingredient-name">
                <div class="ingredient-quantity-container">
                    <input type="number" placeholder="Cantidad" class="ingredient-quantity" step="0.01" min="0">
                    <select class="ingredient-unit">
                        <option value="g">g (gramos)</option>
                        <option value="kg">kg (kilogramos)</option>
                        <option value="ml">ml (mililitros)</option>
                        <option value="l">l (litros)</option>
                        <option value="oz">oz (onzas)</option>
                        <option value="lb">lb (libras)</option>
                        <option value="taza">taza</option>
                        <option value="cda">cda (cucharada)</option>
                        <option value="cdita">cdita (cucharadita)</option>
                        <option value="unidad">unidad</option>
                        <option value="pieza">pieza</option>
                        <option value="diente">diente</option>
                        <option value="hoja">hoja</option>
                        <option value="ramo">ramo</option>
                        <option value="pizca">pizca</option>
                        <option value="al gusto">al gusto</option>
                    </select>
                </div>
                <button type="button" class="btn btn-small btn-secondary" onclick="removeIngredient(this)">-</button>
            `;
            container.appendChild(div);
        }

        function removeIngredient(button) {
            if (document.querySelectorAll('.ingredient-item').length > 1) {
                button.parentElement.remove();
            }
        }

        function addStep() {
            const container = document.getElementById('stepsContainer');
            const div = document.createElement('div');
            div.className = 'step-item';
            div.innerHTML = `
                <input type="text" placeholder="Paso a paso" class="step-text">
                <button type="button" class="btn btn-small btn-secondary" onclick="removeStep(this)">-</button>
            `;
            container.appendChild(div);
        }

        function removeStep(button) {
            if (document.querySelectorAll('.step-item').length > 1) {
                button.parentElement.remove();
            }
        }

        function renderRecipes() {
            const grid = document.getElementById('recipesGrid');
            const filteredRecipes = filterRecipes();
            
            if (filteredRecipes.length === 0) {
                grid.innerHTML = '';
                document.getElementById('noResults').classList.remove('hidden');
                return;
            }
            
            document.getElementById('noResults').classList.add('hidden');
            
            grid.innerHTML = filteredRecipes.map(recipe => {
                const recipeTypes = getRecipeTypes(recipe);
                const recipeTags = Array.isArray(recipe.tags) ? recipe.tags : [];
                return `
                <div class="recipe-card">
                    <div onclick="showRecipeDetail(${recipe.id})" style="cursor: pointer;">
                        ${recipe.image ? 
                            `<img src="${recipe.image}" class="recipe-image" alt="${recipe.name}">` : 
                            `<div class="recipe-image-placeholder">🍳</div>`
                        }
                        <div class="recipe-title">${recipe.name}</div>
                        ${recipeTypes.length ? `<div class="recipe-types">${recipeTypes.map(type => `<span class="recipe-type">${type}</span>`).join('')}</div>` : ''}
                        <div class="recipe-tags">
                            ${recipeTags.map(tag => `<span class="recipe-tag">${tag}</span>`).join('')}
                        </div>
                        <div class="recipe-info">
                            ${recipe.calories ? `<div class="recipe-info-item">🔥 ${recipe.calories} cal</div>` : ''}
                            ${recipe.servings ? `<div class="recipe-info-item">👥 ${recipe.servings} personas</div>` : ''}
                            <div class="recipe-info-item">📋 ${recipe.ingredients.length} ingredientes</div>
                        </div>
                    </div>
                    <div class="recipe-card-actions">
                        <button type="button" class="btn btn-small btn-edit" onclick="editRecipe(${recipe.id}); event.stopPropagation();">✏️ Editar</button>
                        <button type="button" class="btn btn-small btn-delete" onclick="deleteRecipe(${recipe.id}); event.stopPropagation();">🗑️ Eliminar</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        function filterRecipes() {
            return recipes.filter(recipe => {
                const recipeTypes = getRecipeTypes(recipe);
                if (currentFilters.type && !recipeTypes.includes(currentFilters.type)) return false;
                if (currentFilters.tags) {
                    const filterTags = currentFilters.tags.toLowerCase().split(',').map(t => t.trim());
                    const recipeTags = (Array.isArray(recipe.tags) ? recipe.tags : []).map(t => t.toLowerCase());
                    if (!filterTags.some(tag => recipeTags.includes(tag))) return false;
                }
                if (currentFilters.ingredient) {
                    const ingredient = currentFilters.ingredient.toLowerCase();
                    if (!recipe.ingredients.some(ing => ing.name.toLowerCase().includes(ingredient))) return false;
                }
                return true;
            });
        }

        function applyFilters() {
            currentFilters.type = document.getElementById('filterType').value;
            currentFilters.tags = document.getElementById('filterTags').value;
            currentFilters.ingredient = document.getElementById('filterIngredient').value;
            renderRecipes();
        }

        function clearFilters() {
            document.getElementById('filterType').value = '';
            document.getElementById('filterTags').value = '';
            document.getElementById('filterIngredient').value = '';
            currentFilters = { type: '', tags: '', ingredient: '' };
            renderRecipes();
        }

        function showRecipeDetail(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            document.getElementById('detailRecipeId').value = id;

            // Imagen
            const imageContainer = document.getElementById('detailImageContainer');
            if (recipe.image) {
                imageContainer.innerHTML = `
                    <div class="recipe-detail-image-wrapper">
                        <img src="${recipe.image}" class="recipe-detail-image" alt="${recipe.name}">
                    </div>
                `;
            } else {
                imageContainer.innerHTML = `
                    <div class="recipe-detail-image-wrapper">
                        <div class="recipe-detail-image-placeholder">🍳</div>
                    </div>
                `;
            }

            document.getElementById('detailTitle').textContent = recipe.name;
            const detailTypes = document.getElementById('detailTypes');
            const recipeTypes = getRecipeTypes(recipe);
            detailTypes.innerHTML = recipeTypes.map(type => `<span class="recipe-type">${type}</span>`).join('');
            detailTypes.classList.toggle('hidden', recipeTypes.length === 0);

            const detailTags = document.getElementById('detailTags');
            const recipeTags = Array.isArray(recipe.tags) ? recipe.tags : [];
            detailTags.innerHTML = recipeTags.map(tag => 
                `<span class="recipe-tag">${tag}</span>`
            ).join('');

            // Información de calorías y porciones
            const infoHtml = `
                ${recipe.calories ? `
                    <div class="recipe-detail-info-item">
                        <div class="recipe-detail-info-label">Calorías</div>
                        <div class="recipe-detail-info-value">${recipe.calories}</div>
                    </div>
                ` : ''}
                ${recipe.servings ? `
                    <div class="recipe-detail-info-item">
                        <div class="recipe-detail-info-label">Porciones</div>
                        <div class="recipe-detail-info-value">${recipe.servings}</div>
                    </div>
                ` : ''}
                <div class="recipe-detail-info-item">
                    <div class="recipe-detail-info-label">Ingredientes</div>
                    <div class="recipe-detail-info-value">${recipe.ingredients.length}</div>
                </div>
                <div class="recipe-detail-info-item">
                    <div class="recipe-detail-info-label">Pasos</div>
                    <div class="recipe-detail-info-value">${recipe.steps.length}</div>
                </div>
            `;
            document.getElementById('detailInfo').innerHTML = infoHtml;

            document.getElementById('detailIngredients').innerHTML = recipe.ingredients.map(ing => {
                let quantityText = ing.quantity || '';
                if (!quantityText && ing.unit) {
                    quantityText = ing.unit;
                }
                return `<div class="ingredient-list-item">
                    <span>${ing.name}</span>
                    <span><strong>${quantityText}</strong></span>
                </div>`;
            }).join('');

            document.getElementById('detailSteps').innerHTML = recipe.steps.map((step, index) => 
                `<div class="step-list-item">
                    <span class="step-number">${index + 1}.</span>
                    <span>${step}</span>
                </div>`
            ).join('');

            document.getElementById('recipeDetail').classList.add('active');
            document.getElementById('recipesGrid').style.display = 'none';
        }

        function closeDetail() {
            document.getElementById('recipeDetail').classList.remove('active');
            document.getElementById('recipesGrid').style.display = 'grid';
        }


        function editRecipe(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            editingRecipeId = id;
            document.getElementById('editingRecipeId').value = id;
            document.getElementById('submitButton').textContent = 'Actualizar Receta';
            const cancelEditButton = document.getElementById('cancelEditButton');
            if (cancelEditButton) {
                cancelEditButton.classList.remove('hidden');
            }

            // Llenar el formulario con los datos de la receta
            document.getElementById('recipeName').value = recipe.name;
            const recipeTypes = getRecipeTypes(recipe);
            document.querySelectorAll('.type-checkbox').forEach(checkbox => {
                checkbox.checked = recipeTypes.includes(checkbox.value);
            });
            document.getElementById('recipeCalories').value = recipe.calories || '';
            document.getElementById('recipeServings').value = recipe.servings || '';
            document.getElementById('recipeImageUrl').value = recipe.image && !recipe.image.startsWith('data:') ? recipe.image : '';

            // Limpiar y agregar tags
            document.getElementById('tagsContainer').innerHTML = '';
            const existingTags = Array.isArray(recipe.tags) ? recipe.tags : [];
            existingTags.forEach(tag => {
                const tagElement = document.createElement('div');
                tagElement.className = 'tag';
                tagElement.innerHTML = `${tag} <span class="tag-remove" onclick="this.parentElement.remove()">×</span>`;
                document.getElementById('tagsContainer').appendChild(tagElement);
            });

            // Limpiar y agregar ingredientes
            document.getElementById('ingredientsContainer').innerHTML = '';
            recipe.ingredients.forEach(ing => {
                let quantity = '';
                let unit = 'g'; // Por defecto
                
                if (ing.unit) {
                    // Si ya tiene unidad separada, usarla
                    unit = ing.unit;
                    // Intentar extraer solo el número de quantity
                    const quantityMatch = ing.quantity ? ing.quantity.toString().match(/^([\d.]+)/) : null;
                    quantity = quantityMatch ? quantityMatch[1] : ing.quantity || '';
                } else if (ing.quantity) {
                    // Si no tiene unidad separada, intentar extraerla del string
                    const quantityMatch = ing.quantity.toString().match(/^([\d.]+)\s*(.*)$/);
                    if (quantityMatch) {
                        quantity = quantityMatch[1];
                        const extractedUnit = quantityMatch[2].trim().toLowerCase();
                        // Mapear unidades comunes
                        if (extractedUnit && ['g', 'kg', 'ml', 'l', 'oz', 'lb', 'taza', 'cda', 'cdita', 'unidad', 'pieza', 'diente', 'hoja', 'ramo', 'pizca', 'al gusto'].includes(extractedUnit)) {
                            unit = extractedUnit;
                        } else if (extractedUnit) {
                            unit = extractedUnit; // Mantener la unidad original si no coincide
                        }
                    } else {
                        quantity = ing.quantity;
                    }
                }
                
                const div = document.createElement('div');
                div.className = 'ingredient-item';
                div.innerHTML = `
                    <input type="text" placeholder="Ingrediente" class="ingredient-name" value="${ing.name}">
                    <div class="ingredient-quantity-container">
                        <input type="number" placeholder="Cantidad" class="ingredient-quantity" step="0.01" min="0" value="${quantity}">
                        <select class="ingredient-unit">
                            <option value="g" ${unit === 'g' ? 'selected' : ''}>g (gramos)</option>
                            <option value="kg" ${unit === 'kg' ? 'selected' : ''}>kg (kilogramos)</option>
                            <option value="ml" ${unit === 'ml' ? 'selected' : ''}>ml (mililitros)</option>
                            <option value="l" ${unit === 'l' ? 'selected' : ''}>l (litros)</option>
                            <option value="oz" ${unit === 'oz' ? 'selected' : ''}>oz (onzas)</option>
                            <option value="lb" ${unit === 'lb' ? 'selected' : ''}>lb (libras)</option>
                            <option value="taza" ${unit === 'taza' ? 'selected' : ''}>taza</option>
                            <option value="cda" ${unit === 'cda' ? 'selected' : ''}>cda (cucharada)</option>
                            <option value="cdita" ${unit === 'cdita' ? 'selected' : ''}>cdita (cucharadita)</option>
                            <option value="unidad" ${unit === 'unidad' ? 'selected' : ''}>unidad</option>
                            <option value="pieza" ${unit === 'pieza' ? 'selected' : ''}>pieza</option>
                            <option value="diente" ${unit === 'diente' ? 'selected' : ''}>diente</option>
                            <option value="hoja" ${unit === 'hoja' ? 'selected' : ''}>hoja</option>
                            <option value="ramo" ${unit === 'ramo' ? 'selected' : ''}>ramo</option>
                            <option value="pizca" ${unit === 'pizca' ? 'selected' : ''}>pizca</option>
                            <option value="al gusto" ${unit === 'al gusto' ? 'selected' : ''}>al gusto</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-small btn-secondary" onclick="removeIngredient(this)">-</button>
                `;
                document.getElementById('ingredientsContainer').appendChild(div);
            });

            // Si no hay ingredientes, agregar uno vacío
            if (recipe.ingredients.length === 0) {
                addIngredient();
            }

            // Limpiar y agregar pasos
            document.getElementById('stepsContainer').innerHTML = '';
            recipe.steps.forEach(step => {
                const div = document.createElement('div');
                div.className = 'step-item';
                div.innerHTML = `
                    <input type="text" placeholder="Paso a paso" class="step-text" value="${step}">
                    <button type="button" class="btn btn-small btn-secondary" onclick="removeStep(this)">-</button>
                `;
                document.getElementById('stepsContainer').appendChild(div);
            });

            // Si no hay pasos, agregar uno vacío
            if (recipe.steps.length === 0) {
                addStep();
            }

            // Imagen
            if (recipe.image) {
                if (recipe.image.startsWith('data:')) {
                    currentImageData = recipe.image;
                    document.getElementById('imagePreview').src = recipe.image;
                    document.getElementById('imagePreview').classList.remove('hidden');
                } else {
                    currentImageData = null;
                    document.getElementById('imagePreview').src = recipe.image;
                    document.getElementById('imagePreview').classList.remove('hidden');
                }
            } else {
                currentImageData = null;
                document.getElementById('imagePreview').src = '';
                document.getElementById('imagePreview').classList.add('hidden');
            }

            document.getElementById('modalTitle').textContent = 'Editar Receta';
            document.getElementById('submitButton').textContent = 'Actualizar Receta';
            document.getElementById('recipeModal').classList.add('active');
        }

        function editRecipeFromDetail() {
            const id = parseInt(document.getElementById('detailRecipeId').value);
            if (id) {
                closeDetail();
                editRecipe(id);
            }
        }

        async function deleteRecipe(id) {
            if (!confirm('¿Estás seguro de que quieres eliminar esta receta?')) {
                return;
            }

            const detailWasOpen = document.getElementById('recipeDetail').classList.contains('active');
            showLoading('Eliminando receta...');
            let success = false;
            try {
                await deleteRecipeFromStorage(id);
                renderRecipes();
                
                if (detailWasOpen && parseInt(document.getElementById('detailRecipeId').value) === id) {
                    closeDetail();
                }
                success = true;
            } catch (error) {
                console.error('❌ Error al eliminar la receta:', error);
                alert('Ocurrió un error al eliminar la receta. Intenta nuevamente.');
            } finally {
                hideLoading();
            }

            if (success) {
                alert('Receta eliminada exitosamente!');
            }
        }

        function deleteRecipeFromDetail() {
            const id = parseInt(document.getElementById('detailRecipeId').value);
            if (id) {
                deleteRecipe(id);
            }
        }

        // Esta función ya no se usa directamente, se usa saveRecipes() async
    </script>
</body>
</html>
